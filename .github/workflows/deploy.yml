name: CI & Deploy

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - run: npm run lint

      - run: npm test -- --watchAll=false
        env:
          CI: true

      - name: Check OMDb API key
        if: github.event_name != 'pull_request'
        env:
          REACT_APP_API_KEY: ${{ secrets.OMDB_API_KEY || vars.OMDB_API_KEY }}
        run: |
          if [ -z "$REACT_APP_API_KEY" ]; then
            echo "::error::OMDB_API_KEY is not set. Add it as a repository secret (Settings → Secrets and variables → Actions → Repository secrets)."
            exit 1
          fi

      - run: npm run build
        env:
          CI: true
          REACT_APP_API_KEY: ${{ secrets.OMDB_API_KEY || vars.OMDB_API_KEY }}

      # GitHub Pages has no SPA fallback, so serve index.html for unknown paths
      - run: cp build/index.html build/404.html

      - uses: actions/upload-pages-artifact@v3
        if: github.event_name != 'pull_request'
        with:
          path: build

  deploy:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
